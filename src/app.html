<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />
    <script>
      // restore theme before first paint to avoid a flash
      try {
        var t = localStorage.getItem('theme')
        if (
          t === 'dark' ||
          (!t && matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark')
        }
      } catch {
        /* localStorage unavailable — stay on media default */
      }
    </script>
    <script>
      // Set the dock state before hydration when the browser restores scroll.
      ;(() => {
        const root = document.documentElement
        const key = 'rainbook:capture-progress:' + location.pathname
        const navigation = performance.getEntriesByType('navigation')[0]
        const restoring =
          navigation &&
          (navigation.type === 'reload' || navigation.type === 'back_forward')

        const writeProgress = () => {
          const progress = Math.min(
            1,
            Math.max(0, window.scrollY / Math.max(window.innerHeight, 1)),
          )
          root.style.setProperty('--p', progress.toFixed(4))
          try {
            sessionStorage.setItem(key, progress.toFixed(4))
          } catch {
            /* sessionStorage unavailable — retain the live scroll value only */
          }
        }

        let restored = false
        if (restoring) {
          try {
            const saved = Number(sessionStorage.getItem(key))
            if (Number.isFinite(saved)) {
              root.style.setProperty('--p', String(Math.min(1, Math.max(0, saved))))
              restored = true
            }
          } catch {
            /* sessionStorage unavailable — let browser scroll restoration update it */
          }
        }

        if (!restored || window.scrollY > 0) writeProgress()
        window.addEventListener('scroll', writeProgress, { passive: true })
        window.addEventListener('pageshow', writeProgress, { once: true })
      })()
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
