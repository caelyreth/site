# MARK: - workspace
packages:
  - land

# MARK: - catalogs
catalogs:
  tooling:
    oxfmt: ^0.51.0
    oxlint: ^1.69.0
    oxlint-tsgolint: ^0.23.0
    typescript: rc

# MARK: - supply chain
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade

# MARK: - dep opts
strictPeerDependencies: true
engineStrict: true

# MARK: - misc
shellEmulator: true
