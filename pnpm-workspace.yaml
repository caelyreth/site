# MARK: - workspace
packages:
  - land

# MARK: - catalogs
catalogs:
  x:
    # workaround for svelte-check, tracked on
    # https://github.com/sveltejs/language-tools/issues/3063
    '@typescript/native-preview': npm:typescript@rc
    oxfmt: ^0.51.0
    oxlint: ^1.69.0
    oxlint-tsgolint: ^0.23.0
    typescript: rc

# MARK: - supply chain
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade

# MARK: - dep opts
strictPeerDependencies: true
engineStrict: true

# MARK: - misc
shellEmulator: true
